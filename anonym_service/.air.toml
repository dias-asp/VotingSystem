root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/anonym_service"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", "vendor", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = true

[misc]
  clean_on_exit = true
