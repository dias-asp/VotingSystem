server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls. Service hostnames resolve in the docker-compose network.
    location /api/auth/ {
        proxy_pass http://auth_service:8083/;
        proxy_set_header Host $host;
    }

    location /api/audit/ {
        proxy_pass http://audit_service:8082/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://voting_service:8080/;
        proxy_set_header Host $host;
    }
}
